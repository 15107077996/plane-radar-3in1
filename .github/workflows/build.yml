name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync rain overlay from CDN
        run: |
          set +e
          mkdir -p firmware
          {
            echo "== sync $(date -u)"
            test -f .rain-sync && echo "marker yes" || echo "marker no"
            if [ -f .rain-sync ]; then
              curl -fSL -m 90 -o /tmp/i9 "https://aka.doubaocdn.com/s/VEu1PR3nnA" 2>&1
              echo "curl9 rc=$? size=$(stat -c %s /tmp/i9 2>/dev/null)"
              curl -fSL -m 90 -o /tmp/i1 "https://aka.doubaocdn.com/s/sY1uK00bP1" 2>&1
              echo "curl1 rc=$? size=$(stat -c %s /tmp/i1 2>/dev/null)"
              if [ -s /tmp/i9 ] && [ -s /tmp/i1 ]; then
                cp /tmp/i9 src/inc/inc09_rain.inc
                cp /tmp/i1 src/inc/inc01_defs.inc
                sha256sum src/inc/inc09_rain.inc src/inc/inc01_defs.inc
                rm -f .rain-sync
                echo "sources replaced"
              else
                echo "download failed, sources untouched"
              fi
            fi
            grep FW_VER src/inc/inc01_defs.inc
          } > firmware/sync.txt 2>&1
          cat firmware/sync.txt

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio esptool
          pio --version

      - name: Build project
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Collect and merge binaries
        if: success()
        run: |
          mkdir -p firmware
          cp .pio/build/esp32c3/firmware.bin firmware/app.bin
          cp .pio/build/esp32c3/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32c3/partitions.bin firmware/partitions.bin
          BOOTAPP=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          echo "boot_app0: $BOOTAPP"
          cp "$BOOTAPP" firmware/boot_app0.bin
          python3 -m esptool --chip esp32c3 merge_bin -o firmware/firmware.bin --format raw \
            0x0 firmware/bootloader.bin \
            0x8000 firmware/partitions.bin \
            0xe000 firmware/boot_app0.bin \
            0x10000 firmware/app.bin
          ls -l firmware

      - name: Verify merged image
        if: success()
        run: |
          python3 - <<'PY'
          b = open("firmware/firmware.bin", "rb").read()
          assert b[0x0] == 0xE9, "no bootloader magic at 0x0"
          assert b[0x8000] == 0xAA and b[0x8001] == 0x50, "no partition table at 0x8000"
          assert b[0x10000] == 0xE9, "no app magic at 0x10000"
          print("merged ok, size", len(b))
          PY

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/*

      - name: Commit build output to repository
        if: always()
        run: |
          set +e
          mkdir -p firmware
          cp build.log firmware/build.log
          echo "push-probe $(date -u)" >> firmware/sync.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f firmware/sync.txt src/inc/inc09_rain.inc src/inc/inc01_defs.inc
          git status --short | head -20
          git commit -m "fw: build artifacts from ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
          echo "push done rc=$?"
          git rev-parse --short HEAD
