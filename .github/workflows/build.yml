name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio
          pio --version

      - name: Build project
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Collect binaries
        if: success()
        run: |
          mkdir -p firmware
          cp .pio/build/esp32c3/firmware.bin firmware/ || true
          cp .pio/build/esp32c3/bootloader.bin firmware/ || true
          cp .pio/build/esp32c3/partitions.bin firmware/ || true
          cp .pio/build/esp32c3/boot_app0.bin firmware/ || true
          ls -l firmware

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/*

      - name: Commit build output to repository
        if: always()
        run: |
          mkdir -p firmware
          cp build.log firmware/build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware
          git commit -m "fw: build artifacts from ${GITHUB_SHA::7}" || true
          git push || true
