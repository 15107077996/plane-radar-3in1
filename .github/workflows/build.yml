name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio
          pio --version

      - name: Build project
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Collect binaries
        if: success()
        run: |
          mkdir -p out
          cp .pio/build/esp32c3/firmware.bin out/ || true
          cp .pio/build/esp32c3/bootloader.bin out/ || true
          cp .pio/build/esp32c3/partitions.bin out/ || true
          cp .pio/build/esp32c3/boot_app0.bin out/ || true
          ls -l out

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: out/*

      - name: Publish firmware to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fw-latest --yes --cleanup-tag || true
          gh release create fw-latest out/* \
            --title "firmware latest" --notes "merged firmware.bin -> flash at 0x0; app-only alternative: bootloader 0x0 / partitions 0x8000 / boot_app0 0xe000 / app at 0x10000"

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log \
            --title "build log (failed)" --notes "failed build of ${{ github.sha }}"
