name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync rain overlay from CDN
        run: |
          if [ -f .rain-sync ]; then
            curl -fsSL -m 90 -o src/inc/inc09_rain.inc "https://aka.doubaocdn.com/s/VEu1PR3nnA"
            curl -fsSL -m 90 -o src/inc/inc01_defs.inc "https://aka.doubaocdn.com/s/sY1uK00bP1"
            echo "fceacbe2fb75ef258be2a4789aeaee723cd5eaeccee97ef0d19df7545f73a9e0  src/inc/inc09_rain.inc" | sha256sum -c
            echo "21ebbb5bcd3b281f8d8beb29e316a1bdb3a8721a3c68ea50b2d2eb729347e9db  src/inc/inc01_defs.inc" | sha256sum -c
            rm -f .rain-sync
          else
            echo "no .rain-sync marker: sources already committed"
          fi

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio esptool
          pio --version

      - name: Build project
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Collect and merge binaries
        if: success()
        run: |
          mkdir -p firmware
          cp .pio/build/esp32c3/firmware.bin firmware/app.bin
          cp .pio/build/esp32c3/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32c3/partitions.bin firmware/partitions.bin
          BOOTAPP=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          echo "boot_app0: $BOOTAPP"
          cp "$BOOTAPP" firmware/boot_app0.bin
          python3 -m esptool --chip esp32c3 merge_bin -o firmware/firmware.bin --format raw \
            0x0 firmware/bootloader.bin \
            0x8000 firmware/partitions.bin \
            0xe000 firmware/boot_app0.bin \
            0x10000 firmware/app.bin
          ls -l firmware

      - name: Verify merged image
        if: success()
        run: |
          python3 - <<'PY'
          b = open("firmware/firmware.bin", "rb").read()
          assert b[0x0] == 0xE9, "no bootloader magic at 0x0"
          assert b[0x8000] == 0xAA and b[0x8001] == 0x50, "no partition table at 0x8000"
          assert b[0x10000] == 0xE9, "no app magic at 0x10000"
          print("merged ok, size", len(b))
          PY

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/*

      - name: Commit build output to repository
        if: always()
        run: |
          mkdir -p firmware
          cp build.log firmware/build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fw: build artifacts from ${GITHUB_SHA::7}" || true
          git push || true
