name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync rain overlay from CDN
        run: |
          set +e
          echo "== sync "$(date -u) > sync.log
          echo "marker: $(test -f .rain-sync && echo yes || echo no)" >> sync.log
          if [ -f .rain-sync ]; then
            curl -fSL -m 90 -A "Mozilla/5.0" -o /tmp/i9 "https://aka.doubaocdn.com/s/VEu1PR3nnA" >> sync.log 2>&1
            echo "curl9 rc=$? size=$(stat -c %s /tmp/i9 2>/dev/null)" >> sync.log
            curl -fSL -m 90 -A "Mozilla/5.0" -o /tmp/i1 "https://aka.doubaocdn.com/s/sY1uK00bP1" >> sync.log 2>&1
            echo "curl1 rc=$? size=$(stat -c %s /tmp/i1 2>/dev/null)" >> sync.log
            if [ -s /tmp/i9 ] && [ -s /tmp/i1 ]; then
              cp /tmp/i9 src/inc/inc09_rain.inc
              cp /tmp/i1 src/inc/inc01_defs.inc
              echo "sha9 $(sha256sum src/inc/inc09_rain.inc)" >> sync.log
              echo "sha1 $(sha256sum src/inc/inc01_defs.inc)" >> sync.log
              rm -f .rain-sync
            fi
          fi
          echo "ver $(grep FW_VER src/inc/inc01_defs.inc)" >> sync.log

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio esptool
          pio --version

      - name: Build project
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Collect and merge binaries
        if: success()
        run: |
          mkdir -p firmware
          cp .pio/build/esp32c3/firmware.bin firmware/app.bin
          cp .pio/build/esp32c3/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32c3/partitions.bin firmware/partitions.bin
          BOOTAPP=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          echo "boot_app0: $BOOTAPP"
          cp "$BOOTAPP" firmware/boot_app0.bin
          python3 -m esptool --chip esp32c3 merge_bin -o firmware/firmware.bin --format raw \
            0x0 firmware/bootloader.bin \
            0x8000 firmware/partitions.bin \
            0xe000 firmware/boot_app0.bin \
            0x10000 firmware/app.bin
          ls -l firmware

      - name: Verify merged image
        if: success()
        run: |
          python3 - <<'PY'
          b = open("firmware/firmware.bin", "rb").read()
          assert b[0x0] == 0xE9, "no bootloader magic at 0x0"
          assert b[0x8000] == 0xAA and b[0x8001] == 0x50, "no partition table at 0x8000"
          assert b[0x10000] == 0xE9, "no app magic at 0x10000"
          print("merged ok, size", len(b))
          PY

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/*

      - name: Commit build output to repository
        if: always()
        run: |
          mkdir -p firmware
          cp build.log firmware/build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fw: build artifacts from ${GITHUB_SHA::7}" || true
          git push || true
