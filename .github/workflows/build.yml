name: Build Firmware
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: platformio/setup-platformio@v5
        with:
          platformio-version: latest

      - name: Build project
        run: pio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .pio/build/esp32c3/firmware.bin
