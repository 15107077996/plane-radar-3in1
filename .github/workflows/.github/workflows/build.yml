name: Build Firmware
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PlatformIO
        uses: platformio/action@v2
      - name: Build
        run: pio run
      - name: Upload bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            .pio/build/esp32c3dev/bootloader.bin
            .pio/build/esp32c3dev/partitions.bin
            .pio/build/esp32c3dev/firmware.bin
